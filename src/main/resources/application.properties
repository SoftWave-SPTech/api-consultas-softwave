# Configuração da porta do servidor
server.port=${SERVER_PORT:8084}

# Nome da aplicação
spring.application.name=api-consultas-softwave

# Desabilita configurações de banco de dados (caso existam dependências)
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none

# Configuração do RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:myuser}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:secret}
spring.rabbitmq.virtual-host=/

# Nome da exchange, fila e routing key
broker.exchange.name=${RABBITMQ_EXCHANGE:processos.exchange}
broker.queue.name=${RABBITMQ_QUEUE:processos.queue}
broker.routing.key=${RABBITMQ_ROUTING_KEY:processos.key}