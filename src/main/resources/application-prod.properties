# api-consultas-softwave - Configuração de Produção para Nuvem
# Este perfil deve ser usado em ambientes de produção (EC2, ECS, etc.)
# Todas as variáveis sensíveis DEVEM ser fornecidas via variáveis de ambiente

# Configuração da porta do servidor
server.port=${SERVER_PORT:8084}

# Nome da aplicação
spring.application.name=api-consultas-softwave

# Desabilita configurações de banco de dados (caso existam dependências)
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none

# Configuração do RabbitMQ - OBRIGATÓRIO via ENV em produção
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=/

# Nome da exchange, fila e routing key
broker.exchange.name=${RABBITMQ_EXCHANGE:processos.exchange}
broker.queue.name=${RABBITMQ_QUEUE:processos.queue}
broker.routing.key=${RABBITMQ_ROUTING_KEY:processos.key}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Logging para produção - CloudWatch
logging.level.root=INFO
logging.level.com.project.softwave=INFO
logging.level.org.springframework=WARN
logging.file.name=/var/log/softwave/api-consultas.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

